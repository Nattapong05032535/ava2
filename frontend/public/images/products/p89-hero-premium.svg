        <path d="M0 24L8 0L16 24H12L10 18H6L4 24H0ZM9 12L7 6L5 12H9Z" fill="white"/>
        <path d="M18 24V0H24L32 18L40 0H44V24H40V6L34 20H30L24 6V24H20Z" fill="white"/>
