<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="enjoy_body_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fb3f5" />
      <stop offset="100%" stop-color="#3f74b8" />
    </linearGradient>
    <filter id="enjoy_glow" x="-20%" y="-20%" width="140%" height="140%">
      <blur stdDeviation="15" />
    </filter>
  </defs>
  
  <g transform="translate(150, 100) rotate(-4)">
    <!-- Main Device Body -->
    <rect x="0" y="0" width="480" height="850" rx="60" fill="url(#enjoy_body_grad)" />
    <rect x="15" y="15" width="450" height="820" rx="45" fill="#0c1117" />
    
    <!-- Camera Island (Playful) -->
    <rect x="40" y="40" width="180" height="180" rx="40" fill="#ffffff" fill-opacity="0.1" />
    <circle cx="90" cy="90" r="35" fill="#000" />
    <circle cx="170" cy="170" r="35" fill="#000" />
    <circle cx="130" cy="90" r="15" fill="#ffffff" fill-opacity="0.2" />
    
    <!-- Screen Content (Enjoy) -->
    <rect x="30" y="240" width="420" height="520" rx="10" fill="#ffffff" fill-opacity="0.05" />
    <circle cx="240" cy="400" r="80" fill="#7fb3f5" fill-opacity="0.3" filter="url(#enjoy_glow)" />
    <text x="240" y="550" font-family="sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">ENJOY LIFE</text>
  </g>
</svg>
